<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flotta">
<title>Flottakezelő</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script>(function(){var t;try{t=localStorage.getItem('fk_tema')}catch(e){}document.documentElement.setAttribute('data-tema',t==='sotet'?'sotet':'vilagos');})();</script>
<script src="config.js"></script>
<style>
:root,html[data-tema="vilagos"]{
  color-scheme:light;
  --bg:#F2F5FA; --card:#FFFFFF; --card2:#F5F7FB; --line:#E2E8F0; --line2:#EDF1F6; --line3:#D5DDE8;
  --text:#0E1B2E; --muted:#566880; --dim:#6B7A90; --soft:#33445C;
  --acc:#2160E8; --accBg:#2160E8; --accText:#FFFFFF;
  --ok:#1F9D5A; --okT:#13703F; --okS:#E5F5EC; --okB:#BFE5CF;
  --warn:#E39A12; --warnT:#8A5300; --warnS:#FFF4DE; --warnB:#F5D59A;
  --bad:#E5483B; --badT:#B42318; --badS:#FDEDEC; --badB:#F4BDB7;
  --infoT:#1D4FD8; --infoS:#E9F0FE; --mutedT:#4A5A70; --mutedS:#EEF1F5; --none:#B7C2D0;
  --tCyS:#E0F4F7; --tCyT:#0E7490; --tBlS:#E9F0FE; --tBlT:#1D4FD8; --tPuS:#F1ECFD; --tPuT:#6D3FD1; --tGrS:#EEF1F5; --tGrT:#475569;
  --menuBg:rgba(255,255,255,.94); --shadow:0 1px 2px rgba(15,37,87,.05),0 6px 18px rgba(15,37,87,.06); --shadow2:0 14px 36px rgba(15,37,87,.18);
  --overlay:rgba(14,27,46,.45); --toastBg:#0E1B2E; --toastT:#FFFFFF; --toastHBg:#B42318; --toastHT:#FFFFFF; --jelT:#FFFFFF;
  --hero:linear-gradient(135deg,#0F2557 0%,#1B4DB1 58%,#2F74F5 100%); --sbBg:#0F2557;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
html[data-tema="sotet"]{
  color-scheme:dark;
  --bg:#0A0F1C; --card:#121A2B; --card2:#18223A; --line:#223049; --line2:#1B2740; --line3:#2A3A57;
  --text:#E7EDF7; --muted:#97A5BC; --dim:#8291AA; --soft:#C2CCDC;
  --acc:#5B9BFF; --accBg:#2F6FE4; --accText:#FFFFFF;
  --ok:#4FBF85; --okT:#6FD49F; --okS:rgba(79,191,133,.14); --okB:rgba(79,191,133,.35);
  --warn:#F2B33D; --warnT:#F5C25E; --warnS:rgba(242,179,61,.13); --warnB:rgba(242,179,61,.4);
  --bad:#FF7A6E; --badT:#FF9A90; --badS:rgba(255,122,110,.13); --badB:rgba(255,122,110,.45);
  --infoT:#8DB6FF; --infoS:rgba(91,155,255,.16); --mutedT:#AEB9CC; --mutedS:rgba(140,154,180,.16); --none:#4A5873;
  --tCyS:rgba(34,184,207,.16); --tCyT:#67D3E6; --tBlS:rgba(91,155,255,.16); --tBlT:#9DBDF2; --tPuS:rgba(190,160,230,.16); --tPuT:#C9B3F0; --tGrS:rgba(200,200,210,.12); --tGrT:#C3CDD4;
  --menuBg:rgba(14,20,34,.94); --shadow:0 1px 2px rgba(0,0,0,.35); --shadow2:0 14px 40px rgba(0,0,0,.55);
  --overlay:rgba(3,6,14,.65); --toastBg:#24314A; --toastT:#E7EDF7; --toastHBg:#4A2420; --toastHT:#FFD3CE; --jelT:#1A0E0C;
  --hero:linear-gradient(135deg,#0E1A3A 0%,#16357A 58%,#2456C4 100%); --sbBg:#0A0F1C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px}
body{min-height:100vh;overscroll-behavior-y:none}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--sbBg);z-index:35;pointer-events:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
h1,h2,.gr{font-family:'Plus Jakarta Sans',Inter,sans-serif}
#app{max-width:640px;margin:0 auto;padding:calc(18px + var(--sat)) 18px calc(170px + var(--sab))}
.fej{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.fej h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.4px}
.fej .al{font-size:13px;color:var(--muted);margin-top:2px}
.kicsi{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.ikongomb{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;position:relative;text-decoration:none;box-shadow:var(--shadow)}
.ikongomb.acc{color:var(--acc)}
.jelveny{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:var(--jelT);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.kartya{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.sav{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;text-decoration:none;color:var(--text);margin-bottom:14px;border:1px solid}
.sav.bad{background:var(--badS);border-color:var(--badB)}
.sav.warn{background:var(--warnS);border-color:var(--warnB)}
.sav.ok{background:var(--okS);border-color:var(--okB)}
.sav .ik{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--card)}
.sav.bad .ik{color:var(--badT)} .sav.warn .ik{color:var(--warnT)} .sav.ok .ik{color:var(--okT)}
.sav .c{font-size:15px;font-weight:600}
.sav.bad .c{color:var(--badT)} .sav.warn .c{color:var(--warnT)} .sav.ok .c{color:var(--okT)}
.sav .s{font-size:13px;color:var(--soft)}
.racs2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:14px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text)}
.stat .n{font-family:'Plus Jakarta Sans',sans-serif;font-size:30px;font-weight:800;line-height:1.1}
.stat .l,.stat .s{font-size:12px;color:var(--muted)}
.stat .l{font-weight:600}
.szakasz{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}
.szakasz h2{margin:0;font-size:18px;font-weight:700}
.szakasz a,.szakasz span{font-size:13px;font-weight:600;text-decoration:none}
.szakasz span{color:var(--muted);font-weight:500}
.lista{display:flex;flex-direction:column;overflow:hidden}
.sor{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left;width:100%;color:var(--text);text-decoration:none}
.sor:last-child{border-bottom:0}
button.sor:hover,a.sor:hover{background:var(--card2)}
.pont{width:10px;height:10px;border-radius:5px;flex-shrink:0}
.pont.ok{background:var(--ok)} .pont.warn{background:var(--warn)} .pont.bad{background:var(--bad)} .pont.none{background:var(--none)}
.sor .t{display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0}
.sor .t b{font-size:14px;font-weight:600}
.sor .t span{font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--okT);background:var(--okS)} .pill.warn{color:var(--warnT);background:var(--warnS)}
.pill.bad{color:var(--badT);background:var(--badS)} .pill.info{color:var(--infoT);background:var(--infoS)}
.pill.muted{color:var(--mutedT);background:var(--mutedS)}
.ures{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.kereso{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--dim);margin-bottom:12px;box-shadow:var(--shadow)}
.kereso input{flex-grow:1;background:transparent;border:0;outline:0;color:var(--text);font-size:15px;min-width:0}
.chipek{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);color:var(--soft);border:1px solid var(--line)}
.chip.be{background:var(--accBg);color:var(--accText);border-color:var(--accBg)}
.jkartya{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--text);margin-bottom:10px;box-shadow:var(--shadow)}
.jkartya.warn{border-color:var(--warnB)} .jkartya.bad{border-color:var(--badB)}
.jk1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.jk2 b{display:block;font-size:16px;font-weight:600}
.jk2 span{font-size:12px;color:var(--muted)}
.jelzok{display:flex;gap:6px;flex-wrap:wrap}
.jelzo{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:9px;background:var(--card2);font-size:12px;color:var(--soft)}
.jelzo i{width:7px;height:7px;border-radius:4px;display:inline-block}
.jelzo i.ok{background:var(--ok)} .jelzo i.warn{background:var(--warn)} .jelzo i.bad{background:var(--bad)} .jelzo i.none{background:var(--none)}
.rsz{display:inline-flex;align-items:stretch;border-radius:5px;overflow:hidden;background:#F4F6F8;border:1px solid #C9D1D8;flex-shrink:0}
.rsz i{width:13px;background:#2F5FB3;color:#fff;font-size:8px;font-weight:700;font-style:normal;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.rsz b{padding:3px 8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;color:#11161A;letter-spacing:.6px}
.rsz.nagy i{width:15px;font-size:9px;padding-bottom:3px} .rsz.nagy b{font-size:18px;padding:4px 10px;letter-spacing:.8px}
.felso{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.hos{padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.hos .c{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800}
.hos .m{font-size:13px;color:var(--muted);margin-top:3px}
.racs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;background:var(--card2);border:0;text-align:left;color:var(--text)}
.mini span{font-size:11px;color:var(--muted)} .mini b{font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:800}
.mini em{font-style:normal;font-size:11px;color:var(--muted)}
.csempe{text-align:left;display:flex;flex-direction:column;gap:3px;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);min-height:76px}
.csempe .l{font-size:12px;color:var(--muted);font-weight:500}
.csempe .d{font-size:14px;font-weight:600}
.csempe .r{font-size:12px;font-weight:600}
.csempe.ok .r{color:var(--okT)} .csempe.warn{border-color:var(--warnB)} .csempe.warn .r{color:var(--warnT)}
.csempe.bad{border-color:var(--badB);background:var(--badS)} .csempe.bad .r{color:var(--badT)}
.csempe.nincs{border-style:dashed;background:transparent} .csempe.nincs .d{color:var(--dim);font-weight:500} .csempe.nincs .r{color:var(--acc)}
.megj{padding:14px;font-size:14px;color:var(--soft);white-space:pre-wrap;margin-top:12px}
.szegmens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.szegmens button{height:38px;border-radius:10px;border:0;font-size:13px;font-weight:600;background:transparent;color:var(--soft)}
.szegmens button.be{background:var(--accBg);color:var(--accText)}
.csop{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:16px 0 8px}
.csop.bad{color:var(--badT)} .csop.warn{color:var(--warnT)} .csop.ok{color:var(--muted)}
.dat{width:46px;height:46px;border-radius:12px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dat b{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:800;line-height:1}
.dat span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.dat.bad{background:var(--badS);color:var(--badT)} .dat.warn{background:var(--warnS);color:var(--warnT)} .dat.ok{background:var(--card2);color:var(--soft)}
.rel{font-size:12px;font-weight:600;white-space:nowrap}
.rel.bad{color:var(--badT)} .rel.warn{color:var(--warnT)} .rel.ok{color:var(--muted)}
.avatar{width:42px;height:42px;border-radius:21px;background:var(--infoS);display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;color:var(--infoT);flex-shrink:0}
.okm2{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
@media (min-width:520px){.okm2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.okm2 .jelzo{justify-content:flex-start}
.okm2 .jelzo span{flex-grow:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.okm2 .jelzo b{font-weight:600;white-space:nowrap}
.okm2 .jelzo b.warn{color:var(--warnT)} .okm2 .jelzo b.bad{color:var(--badT)}
/* színes ikoncsempék */
.t-cy{background:var(--tCyS);color:var(--tCyT)} .t-bl{background:var(--tBlS);color:var(--tBlT)} .t-pu{background:var(--tPuS);color:var(--tPuT)} .t-gr{background:var(--tGrS);color:var(--tGrT)}
.t-ok{background:var(--okS);color:var(--okT)} .t-warn{background:var(--warnS);color:var(--warnT)} .t-bad{background:var(--badS);color:var(--badT)}
/* fejléc-sáv (hero) */
.hero{position:relative;margin:calc(-18px - var(--sat)) -18px 0;padding:calc(20px + var(--sat)) 20px 64px;background:var(--hero);color:#fff;border-radius:0 0 28px 28px;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%);pointer-events:none}
.hero .hsor{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.hero .kicsi{color:rgba(255,255,255,.75)}
.hero h1{margin:4px 0 0;font-size:26px;font-weight:800;letter-spacing:-.4px;color:#fff}
.hero .al{font-size:13px;color:rgba(255,255,255,.78);margin-top:4px;line-height:1.45}
.hero .hgombok{display:flex;gap:8px}
.hgomb{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;text-decoration:none;flex-shrink:0}
.hgomb .jelveny{border-color:#1B4DB1}
.hero .sav{position:relative;z-index:1;margin:16px 0 0;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(4px)}
.hero .sav .ik{background:rgba(255,255,255,.95)}
.hero .sav.bad .ik{color:#B42318} .hero .sav.warn .ik{color:#8A5300} .hero .sav.ok .ik{color:#13703F}
.hero .sav .c{color:#fff} .hero .sav .s{color:rgba(255,255,255,.8)}
.nyil{color:var(--dim);flex-shrink:0} .hero .nyil{color:rgba(255,255,255,.8)}
.hero .mezo label{color:rgba(255,255,255,.8)}
.hero .mezo select{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.hero .mezo select option{color:#0E1B2E;background:#fff}
.hero .mezo{position:relative;z-index:1;margin:16px 0 0}
.rajta{position:relative;z-index:2;margin-top:-44px}
/* Flotta most kártya */
.fmost{padding:16px;display:flex;flex-direction:column;gap:14px}
.fmost .ffej{display:flex;justify-content:space-between;align-items:baseline}
.fmost .ffej h2{margin:0;font-size:17px;font-weight:800}
.fmost .ffej a{font-size:13px;font-weight:600;text-decoration:none}
.fmost .stat{background:var(--card2);border:1px solid var(--line2);border-radius:14px;box-shadow:none}
.allapotsav{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line2);gap:2px}
.allapotsav i{display:block;height:100%}
.allapotsav .f{background:var(--ok)} .allapotsav .sz{background:var(--warn)} .allapotsav .a{background:var(--none)}
.jelmagy{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.jelmagy span{display:inline-flex;align-items:center;gap:6px}
.jelmagy i{width:8px;height:8px;border-radius:4px;display:inline-block}
.jelmagy b{color:var(--text);font-weight:700}
/* idővonal */
.idovonal .sor{position:relative}
.idovonal .sor .pont{position:relative;z-index:1;box-shadow:0 0 0 4px var(--card)}
.idovonal .sor:not(:last-child)::before{content:'';position:absolute;left:18.5px;top:50%;bottom:-50%;width:1px;background:var(--line);z-index:0}
/* művelet-kártya (sofőr) */
.muvkartya{padding:12px}
.muvkartya .racs2{gap:10px}
/* alsó menü */
nav.menu{position:fixed;left:0;right:0;bottom:0;background:var(--menuBg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20;padding-bottom:var(--sab)}
nav.menu .in{max-width:640px;margin:0 auto;height:72px;display:flex;justify-content:space-around;align-items:flex-start;padding:10px 6px 0}
nav.menu a{display:flex;flex-direction:column;align-items:center;gap:4px;width:70px;min-height:44px;text-decoration:none;color:var(--dim);font-size:11px;font-weight:500;position:relative}
nav.menu a.be{color:var(--acc);font-weight:700}
nav.menu a .jelveny{top:-6px;right:10px}
.fab{position:fixed;right:max(20px,calc(50% - 300px));bottom:calc(96px + var(--sab));width:58px;height:58px;border-radius:20px;background:var(--accBg);color:var(--accText);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(33,96,232,.38);border:0;z-index:21}
/* lap (bottom sheet) */
.hatter{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:be .15s}
.lap{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + var(--sab));box-shadow:var(--shadow2);animation:fel .2s}
@keyframes be{from{opacity:0}} @keyframes fel{from{transform:translateY(40px)}}
.fogo{width:40px;height:5px;border-radius:3px;background:var(--line3);margin:0 auto 12px}
.lapfej{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.lapfej h2{margin:0;font-size:21px;font-weight:800}
.mezo{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.mezo label,.mezo .lbl{font-size:12px;color:var(--muted);font-weight:600}
.mezo input,.mezo select,.mezo textarea{height:46px;padding:0 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line3);color:var(--text);font-size:16px;outline:0;width:100%}
.mezo textarea{height:80px;padding:10px 12px;resize:vertical}
.mezo input:focus,.mezo select:focus,.mezo textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--infoS)}
.mezo .tipp{font-size:12px;color:var(--dim)}
.ket{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gomb{height:50px;border-radius:14px;border:0;background:var(--accBg);color:var(--accText);font-weight:700;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.gomb:disabled{opacity:.6}
.gomb.masod{background:var(--card2);color:var(--text);border:1px solid var(--line3)}
