<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flotta">
<title>Flottakezelő</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --bg:#0F1418; --card:#182027; --card2:#1F2930; --line:#26323B; --line2:#222D35;
  --text:#E8EEF2; --muted:#9AA8B3; --dim:#8C9AA5; --soft:#C3CDD4;
  --acc:#45C2B5; --accText:#0B1714;
  --ok:#4FBF85; --okT:#6FD49F; --warn:#F2B33D; --warnT:#F5C25E; --bad:#FF7A6E; --badT:#FF9A90;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
h1,h2,.gr{font-family:'Space Grotesk',Inter,sans-serif}
#app{max-width:640px;margin:0 auto;padding:calc(18px + var(--sat)) 18px calc(110px + var(--sab))}
.fej{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.fej h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.3px}
.fej .al{font-size:13px;color:var(--muted);margin-top:2px}
.kicsi{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.3px}
.ikongomb{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;position:relative;text-decoration:none}
.ikongomb.acc{color:var(--acc)}
.jelveny{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#1A0E0C;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.kartya{background:var(--card);border:1px solid var(--line);border-radius:16px}
.sav{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;text-decoration:none;color:var(--text);margin-bottom:14px;border:1px solid}
.sav.bad{background:rgba(255,122,110,.12);border-color:rgba(255,122,110,.35)}
.sav.warn{background:rgba(242,179,61,.10);border-color:rgba(242,179,61,.35)}
.sav.ok{background:rgba(79,191,133,.10);border-color:rgba(79,191,133,.3)}
.sav .ik{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sav.bad .ik{background:rgba(255,122,110,.18);color:var(--badT)}
.sav.warn .ik{background:rgba(242,179,61,.18);color:var(--warnT)}
.sav.ok .ik{background:rgba(79,191,133,.18);color:var(--okT)}
.sav .c{font-size:15px;font-weight:600}
.sav.bad .c{color:var(--badT)} .sav.warn .c{color:var(--warnT)} .sav.ok .c{color:var(--okT)}
.sav .s{font-size:13px;color:var(--soft)}
.racs2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:14px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text)}
.stat .n{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.stat .l,.stat .s{font-size:12px;color:var(--muted)}
.szakasz{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.szakasz h2{margin:0;font-size:18px;font-weight:600}
.szakasz a,.szakasz span{font-size:13px;font-weight:600;text-decoration:none}
.szakasz span{color:var(--muted);font-weight:500}
.lista{display:flex;flex-direction:column;overflow:hidden}
.sor{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left;width:100%;color:var(--text);text-decoration:none}
.sor:last-child{border-bottom:0}
.pont{width:10px;height:10px;border-radius:5px;flex-shrink:0}
.pont.ok{background:var(--ok)} .pont.warn{background:var(--warn)} .pont.bad{background:var(--bad)} .pont.none{background:#4A5863}
.sor .t{display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0}
.sor .t b{font-size:14px;font-weight:600}
.sor .t span{font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--okT);background:rgba(79,191,133,.14)} .pill.warn{color:var(--warnT);background:rgba(242,179,61,.14)}
.pill.bad{color:var(--badT);background:rgba(255,122,110,.14)} .pill.info{color:#6FD6CB;background:rgba(69,194,181,.14)}
.pill.muted{color:#AEB9C2;background:rgba(140,154,165,.16)}
.ures{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.kereso{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--dim);margin-bottom:12px}
.kereso input{flex-grow:1;background:transparent;border:0;outline:0;color:var(--text);font-size:15px;min-width:0}
.chipek{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);color:var(--soft);border:1px solid var(--line)}
.chip.be{background:var(--acc);color:var(--accText);border-color:var(--acc)}
.jkartya{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--text);margin-bottom:10px}
.jkartya.warn{border-color:rgba(242,179,61,.45)} .jkartya.bad{border-color:rgba(255,122,110,.55)}
.jk1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.jk2 b{display:block;font-size:16px;font-weight:600}
.jk2 span{font-size:12px;color:var(--muted)}
.jelzok{display:flex;gap:6px;flex-wrap:wrap}
.jelzo{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:9px;background:var(--card2);font-size:12px;color:var(--soft)}
.jelzo i{width:7px;height:7px;border-radius:4px;display:inline-block}
.jelzo i.ok{background:var(--ok)} .jelzo i.warn{background:var(--warn)} .jelzo i.bad{background:var(--bad)} .jelzo i.none{background:#4A5863}
.rsz{display:inline-flex;align-items:stretch;border-radius:5px;overflow:hidden;background:#F4F6F8;border:1px solid #C9D1D8;flex-shrink:0}
.rsz i{width:13px;background:#2F5FB3;color:#fff;font-size:8px;font-weight:700;font-style:normal;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.rsz b{padding:3px 8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#11161A;letter-spacing:.6px}
.rsz.nagy i{width:15px;font-size:9px;padding-bottom:3px} .rsz.nagy b{font-size:18px;padding:4px 10px;letter-spacing:.8px}
.felso{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.hos{padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.hos .c{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700}
.hos .m{font-size:13px;color:var(--muted);margin-top:3px}
.racs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;background:var(--card2);border:0;text-align:left;color:var(--text)}
.mini span{font-size:11px;color:var(--muted)} .mini b{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700}
.mini em{font-style:normal;font-size:11px;color:var(--muted)}
.csempe{text-align:left;display:flex;flex-direction:column;gap:3px;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);min-height:76px}
.csempe .l{font-size:12px;color:var(--muted);font-weight:500}
.csempe .d{font-size:14px;font-weight:600}
.csempe .r{font-size:12px;font-weight:600}
.csempe.ok .r{color:var(--okT)} .csempe.warn{border-color:rgba(242,179,61,.45)} .csempe.warn .r{color:var(--warnT)}
.csempe.bad{border-color:rgba(255,122,110,.55);background:rgba(255,122,110,.08)} .csempe.bad .r{color:var(--badT)}
.csempe.nincs{border-style:dashed;background:transparent} .csempe.nincs .d{color:var(--dim);font-weight:500} .csempe.nincs .r{color:var(--acc)}
.megj{padding:14px;font-size:14px;color:var(--soft);white-space:pre-wrap;margin-top:12px}
.szegmens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.szegmens button{height:38px;border-radius:10px;border:0;font-size:13px;font-weight:600;background:transparent;color:var(--soft)}
.szegmens button.be{background:var(--acc);color:var(--accText)}
.csop{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:16px 0 8px}
.csop.bad{color:var(--badT)} .csop.warn{color:var(--warnT)} .csop.ok{color:var(--muted)}
.dat{width:46px;height:46px;border-radius:12px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dat b{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;line-height:1}
.dat span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.dat.bad{background:rgba(255,122,110,.16);color:var(--badT)} .dat.warn{background:rgba(242,179,61,.16);color:var(--warnT)} .dat.ok{background:var(--card2);color:var(--soft)}
.rel{font-size:12px;font-weight:600;white-space:nowrap}
.rel.bad{color:var(--badT)} .rel.warn{color:var(--warnT)} .rel.ok{color:var(--muted)}
.avatar{width:42px;height:42px;border-radius:21px;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--soft);flex-shrink:0}
.okm2{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
@media (min-width:520px){.okm2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.okm2 .jelzo{justify-content:flex-start}
.okm2 .jelzo span{flex-grow:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.okm2 .jelzo b{font-weight:600;white-space:nowrap}
.okm2 .jelzo b.warn{color:var(--warnT)} .okm2 .jelzo b.bad{color:var(--badT)}
/* alsó menü */
nav.menu{position:fixed;left:0;right:0;bottom:0;background:#141B21;border-top:1px solid var(--line);z-index:20;padding-bottom:var(--sab)}
nav.menu .in{max-width:640px;margin:0 auto;height:72px;display:flex;justify-content:space-around;align-items:flex-start;padding:10px 6px 0}
nav.menu a{display:flex;flex-direction:column;align-items:center;gap:4px;width:70px;min-height:44px;text-decoration:none;color:var(--dim);font-size:11px;font-weight:500;position:relative}
nav.menu a.be{color:var(--acc);font-weight:600}
nav.menu a .jelveny{top:-6px;right:10px}
.fab{position:fixed;right:max(20px,calc(50% - 300px));bottom:calc(96px + var(--sab));width:58px;height:58px;border-radius:20px;background:var(--acc);color:var(--accText);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.45);border:0;z-index:21}
/* lap (bottom sheet) */
.hatter{position:fixed;inset:0;background:rgba(4,7,9,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:be .15s}
.lap{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--card);border-top:1px solid #2E3B45;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + var(--sab));box-shadow:0 -12px 40px rgba(0,0,0,.5);animation:fel .2s}
@keyframes be{from{opacity:0}} @keyframes fel{from{transform:translateY(40px)}}
.fogo{width:40px;height:5px;border-radius:3px;background:#3A4852;margin:0 auto 12px}
.lapfej{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.lapfej h2{margin:0;font-size:21px;font-weight:700}
.mezo{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.mezo label,.mezo .lbl{font-size:12px;color:var(--muted);font-weight:600}
.mezo input,.mezo select,.mezo textarea{height:46px;padding:0 12px;border-radius:12px;background:var(--card2);border:1px solid #2E3B45;color:var(--text);font-size:16px;outline:0;width:100%}
.mezo textarea{height:80px;padding:10px 12px;resize:vertical}
.mezo input:focus,.mezo select:focus,.mezo textarea:focus{border-color:var(--acc)}
.mezo .tipp{font-size:12px;color:var(--dim)}
.ket{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gomb{height:50px;border-radius:14px;border:0;background:var(--acc);color:var(--accText);font-weight:700;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.gomb:disabled{opacity:.6}
.gomb.masod{background:var(--card2);color:var(--text);border:1px solid #2E3B45}
.gomb.torol{background:transparent;color:var(--badT);border:1px solid rgba(255,122,110,.4);margin-top:10px}
.porog{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(11,23,20,.3);border-top-color:var(--accText);animation:forog .7s linear infinite}
@keyframes forog{to{transform:rotate(360deg)}}
.muvracs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.muv{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:16px;background:var(--card2);border:1px solid #2E3B45;color:var(--text);font-size:13px;font-weight:600;text-align:center}
.muv .ik{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.muv:disabled{opacity:.42}
.muv small{font-size:11px;color:var(--muted);font-weight:500;margin-top:-4px}
#toast{position:fixed;left:50%;bottom:calc(170px + var(--sab));transform:translateX(-50%);background:#24313A;color:var(--text);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.lat{opacity:1}
#toast.hiba{background:#4A2420;color:#FFD3CE}
.offline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--warnT);background:rgba(242,179,61,.1);border:1px solid rgba(242,179,61,.3);border-radius:10px;padding:7px 10px;margin-bottom:12px}
.belepes{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:380px;margin:0 auto}
.logo{width:72px;height:72px;border-radius:22px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:var(--accText)}
.belepes h1{margin:0;font-size:30px}
.belepes p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.hibauz{color:var(--badT);font-size:14px;min-height:20px}
.infok{padding:14px;font-size:14px;line-height:1.55;color:var(--soft)}
.infok b{color:var(--text)}
.kod{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--card2);padding:8px 10px;border-radius:10px;display:block;margin:6px 0;color:var(--text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:700px){.racs2.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app"></div>
<div id="menu-hely"></div>
<div id="lap-hely"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
'use strict';

var VERZIO = '0.1';
var API = (window.FLOTTA_API || '').trim();
var LS = { kod: 'fk_kod', ceg: 'fk_ceg', adat: 'fk_adat' };

/* ───── állapot ───── */
var S = {

  ember: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>',
  menu: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',

  vissza: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  jobbra: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA8B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  ceruza: '<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  x: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',

    mezo('figy', 'Figyelmeztetés (nap előtte)', o.figy, ' inputmode="numeric" placeholder="' + esc(ti.figy || (S.A && S.A.alapFigy) || '30, 14, 3') + '"') +
    '<div class="mezo" style="margin-top:-6px"><span class="tipp">Üresen hagyva a típus alapértékét használja.</span></div>' +
    '<button class="gomb" type="submit">Mentés</button>' +
    (uj ? '' : '<button class="gomb torol" type="button" data-act="okm-torol" data-id="' + esc(o.id) + '">Tétel törlése</button>') +
    '</form>');
}

function kmLap(id) {
  var lista = jarmuvek().filter(function (j) { return j.allapot !== 'Eladva'; });
  var j = id ? jarmu(id) : null;
  lapNyit(lapFej('Km-állás') + '<form data-form="km" autocomplete="off">' +
    (j ? '<input type="hidden" name="id" value="' + esc(j.id) + '"><div class="mezo"><span class="lbl">Jármű</span><div style="font-size:16px;font-weight:600">' + esc(j.rendszam) + (j.km !== '' && j.km !== undefined ? ' <span style="color:var(--muted);font-weight:500;font-size:13px">· eddig ' + km(j.km) + ' km</span>' : '') + '</div></div>'
      : '<div class="mezo"><label for="m-id">Jármű *</label><select id="m-id" name="id" required><option value="">– válassz –</option>' + lista.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.rendszam + (x.km !== '' && x.km !== undefined ? ' · ' + km(x.km) + ' km' : '')) + '</option>'; }).join('') + '</select></div>') +
    '<div class="ket">' + mezo('km', 'Km-állás *', '', ' inputmode="numeric" required') + mezo('datum', 'Dátum', isoMa(), ' type="date"') + '</div>' +
    '<button class="gomb" type="submit">Mentés</button></form>');
}

function urlapAdat(form) {
  var o = {};
  Array.prototype.forEach.call(form.elements, function (el) { if (el.name) o[el.name] = el.value; });
  return o;
}
function kuld(gomb, body, siker) {
  if (S.offline && !navigator.onLine) { toast('Nincs internet – mentéshez kapcsolat kell.', true); return; }
  var szoveg = gomb.innerHTML;
  gomb.disabled = true;
  gomb.innerHTML = '<span class="porog"></span>Mentés…';
  apiPost(body).then(function (res) {
    if (res && res.ok) {
      adatBe(res.adatok);
      lapZar();
      if (siker) siker(res);
      rajzol();
      toast('Elmentve');
    } else {
      gomb.disabled = false; gomb.innerHTML = szoveg;
      if (res && (res.hiba === 'kod' || res.hiba === 'zarolva')) { lapZar(); kilep(hibaSzoveg(res) + ' Lépj be újra.'); return; }
      toast(hibaSzoveg(res), true);
    }
  }, function () {
    gomb.disabled = false; gomb.innerHTML = szoveg;
    toast(hibaSzoveg(null), true);
  });
}
// kétlépéses törlés: első koppintásra kérdez
function torlesMegerosit(gomb, szoveg) {
  if (gomb.dataset.biztos) return true;
  gomb.dataset.biztos = '1';
  gomb.textContent = szoveg;
  setTimeout(function () { if (gomb.isConnected) { delete gomb.dataset.biztos; } }, 4000);
  return false;
}

/* ───── események ───── */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;
  if (act === 'hatter') { if (e.target === el) lapZar(); return; }
  if (act === 'zar') return lapZar();
  if (act === 'fab') return fabLap();
  if (act === 'jarmu-uj') return jarmuLap();
  if (act === 'jarmu-szerk') return jarmuLap(el.dataset.id);
  if (act === 'sofor-uj') return soforLap();
  if (act === 'sofor-szerk') return soforLap(el.dataset.id);
  if (act === 'km') return kmLap(el.dataset.id);
  if (act === 'okm-uj') {
    var elo = el.dataset.elo || '';
    if (el.dataset.tulaj) return okmLap({ kihez: el.dataset.kihez, tulaj: el.dataset.tulaj, tipus: el.dataset.tipus, fix: true });
    if (!jarmuvek().length && !soforok().length) { lapZar(); toast('Előbb vegyél fel egy járművet vagy sofőrt.', true); return; }
    if (elo) return okmLap({ kihez: elo[0] === 'S' ? 'Sofőr' : 'Jármű', tulaj: elo.slice(2), fix: true });
    return okmLap({ kihez: 'Jármű' });
  }
  if (act === 'okm-szerk') {
    var o = okmanyok().filter(function (x) { return x.id === el.dataset.id; })[0];
    if (o) okmLap(o);
    return;
  }
  if (act === 'jarmu-torol') {
    var n = okmTulajnal('Jármű', el.dataset.id).length;
    if (!torlesMegerosit(el, 'Biztosan törlöd?' + (n ? ' (' + n + ' lejárattal együtt)' : '') + ' Koppints újra')) return;
    return kuld(el, { a: 'jarmu_torles', id: el.dataset.id }, function () { location.hash = '#/jarmuvek'; });
  }
  if (act === 'sofor-torol') {
    if (!torlesMegerosit(el, 'Biztosan törlöd? Koppints újra')) return;
    return kuld(el, { a: 'sofor_torles', id: el.dataset.id }, function () { location.hash = '#/soforok'; });
  }
  if (act === 'okm-torol') {
    if (!torlesMegerosit(el, 'Biztosan törlöd? Koppints újra')) return;
    return kuld(el, { a: 'okm_torles', id: el.dataset.id });
  }
  if (act === 'szuro') { S.jarmuSzuro = el.dataset.v; return rajzol(); }
  if (act === 'szeg') { S.emlekSzeg = el.dataset.v; return rajzol(); }
  if (act === 'frissit') return frissit(false);
  if (act === 'kilep') { if (!torlesMegerosit(el, 'Biztosan kilépsz? Koppints újra')) return; return kilep(''); }
  if (act === 'masol') {
    var v = el.dataset.v;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { toast('Kimásolva'); }, function () { toast('Nem sikerült másolni – jelöld ki kézzel.', true); });
  }
});

document.addEventListener('input', function (e) {
  if (e.target.dataset && e.target.dataset.input === 'kereses') {
    S.kereses = e.target.value;
    // csak a listát rajzolja újra, hogy a billentyűzet nyitva maradjon
    var q = S.kereses.toLowerCase();
    var lathato = jarmuvek().filter(function (j) {
      if (S.jarmuSzuro !== 'Mind' && j.allapot !== S.jarmuSzuro) return false;
      return !q || [j.rendszam, j.tipus, j.alvaz, j.megj].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    var l = document.getElementById('jlista');
    if (l) l.innerHTML = jarmuKartyak(lathato);
  }
});

document.addEventListener('change', function (e) {
  if (e.target.dataset && e.target.dataset.change === 'okm-ujra') {
    // tulaj vagy típus változott: az űrlap újrarajzolása a megfelelő mezőkkel
    var f = e.target.form, d = urlapAdat(f);
    var kihez = d.tulaj && d.tulaj[0] === 'S' ? 'Sofőr' : 'Jármű';
    var tipus = e.target.name === 'tulaj' ? '' : d.tipus;
    okmLap({ kihez: kihez, tulaj: d.tulaj ? d.tulaj.slice(2) : '', tipus: tipus, megj: d.megj, figy: d.figy, lejarat: d.lejarat, utolso: d.utolso, fix: d.fix === '1' });
    var t = document.getElementById('m-tulaj');
    if (t) t.value = d.tulaj || '';
  }
});

document.addEventListener('submit', function (e) {
  var f = e.target;
  var tipus = f.dataset.form;
  if (!tipus) return;
  e.preventDefault();
  var d = urlapAdat(f);
  var gomb = f.querySelector('button[type=submit]');
  if (tipus === 'belep') {
    var kod = String(d.kod || '').trim();
    if (!kod) return;
    gomb.disabled = true; gomb.innerHTML = '<span class="porog"></span>Ellenőrzés…';
    apiGet({ a: 'belep', kod: kod }).then(function (res) {
      if (res && res.ok) {
        S.kod = kod; lsSet(LS.kod, kod);
        if (res.ceg) { S.ceg = res.ceg; lsSet(LS.ceg, res.ceg); }
        S.A = null; rajzol(); frissit(true);
      } else {
        gomb.disabled = false; gomb.textContent = 'Belépés';
        document.getElementById('belep-hiba').textContent = hibaSzoveg(res);
      }
    }, function () {
      gomb.disabled = false; gomb.textContent = 'Belépés';
      document.getElementById('belep-hiba').textContent = hibaSzoveg(null);
    });
    return;
  }
  if (tipus === 'jarmu') {
    return kuld(gomb, { a: 'jarmu_mentes', rec: d }, function (res) { if (!d.id && res.id) location.hash = '#/jarmu/' + encodeURIComponent(res.id); });
  }
  if (tipus === 'sofor') {
    return kuld(gomb, { a: 'sofor_mentes', rec: d }, function (res) { if (!d.id && res.id) location.hash = '#/sofor/' + encodeURIComponent(res.id); });
  }
  if (tipus === 'okm') {
    if (!d.tulaj) { toast('Válaszd ki, kihez tartozik.', true); return; }
    var rec = { id: d.id, kihez: d.tulaj[0] === 'S' ? 'Sofőr' : 'Jármű', tulaj: d.tulaj.slice(2), tipus: d.tipus, lejarat: d.lejarat || '', utolso: d.utolso || '', megj: d.megj, figy: d.figy };
    return kuld(gomb, { a: 'okm_mentes', rec: rec });
  }
  if (tipus === 'km') {
    var j = jarmu(d.id);
    var n = Number(String(d.km).replace(/\s/g, ''));
    if (!j || !(n >= 0)) { toast('Add meg a járművet és a km-állást.', true); return; }
    if (j.km !== '' && j.km !== undefined && n < Number(j.km) && !gomb.dataset.biztos) {
      gomb.dataset.biztos = '1'; gomb.textContent = 'Kevesebb, mint az eddigi (' + km(j.km) + ') – mégis mentem';
      return;
    }
    return kuld(gomb, { a: 'km', id: d.id, km: n, datum: d.datum });
  }
});

document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lapZar(); });

/* ───── indulás ───── */
rajzol();
if (S.kod) frissit(true);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.kod && !document.querySelector('.lap')) frissit(true);
});
window.addEventListener('online', function () { if (S.kod) frissit(true); });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
window.__fk = S; // tesztekhez
})();
</script>
